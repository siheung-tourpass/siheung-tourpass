    <rect x="24" y="24" width="64" height="64" rx="16" fill="#EAF3ED"/>
    <g class="icon" transform="translate(32 32)" aria-hidden="true"><rect x="4" y="5" width="40" height="16" rx="4"/><rect x="4" y="27" width="40" height="16" rx="4"/><path d="M12 13h1M12 35h1M23 13h13M23 35h13"/></g>
    <text x="104" y="63" class="label">02 | 핵심 처리</text>
    <text x="24" y="126" class="heading">Spring Boot</text>
    <text x="24" y="154" class="subtitle">Kotlin · Java · 단일 WAR</text>
    <text x="24" y="181" class="subtitle">레이어드 모놀리식 · MVC</text>
    <path d="M24 200H376" stroke="#DBDEE3"/>
    <text x="24" y="233" class="role">Controller · Handler · JSP</text>
    <text x="24" y="264" class="body">인증·권한 검사 · HTML / JSON 응답</text>
    <text x="24" y="315" class="role">Service</text>
    <text x="24" y="346" class="body">여행 · 추천 · 이용권 · 피드백</text>
  </g>
  <g transform="translate(1144 24)">
