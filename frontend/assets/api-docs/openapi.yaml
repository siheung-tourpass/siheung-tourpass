      required: [id, ownerId, name, travelDate, status, issuedPassId, createdAt, updatedAt, places, benefitPassHistory, _links]
      properties:
        id: {type: string}
        ownerId: {type: string}
        name: {type: string}
        travelDate: {type: [string, 'null']}
        status: {type: string, enum: [PLANNING, CONFIRMED, ARCHIVED]}
        issuedPassId: {type: [string, 'null']}
        createdAt: {type: string}
        updatedAt: {type: string}
        places: {type: array, items: {$ref: '#/components/schemas/JourneyPlace'}}
        benefitPass: {$ref: '#/components/schemas/PassDetail'}
        benefitPassHistory: {type: array, items: {$ref: '#/components/schemas/BenefitPassLink'}}
        _links: {$ref: '#/components/schemas/Links'}
    PassSummary:
      type: object
