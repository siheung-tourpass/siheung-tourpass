openapi: 3.1.0
info:
  title: 시흥 투어패스 API
  version: v1
  description: |
    현재 구현된 `/api/v1` API만 기능별로 묶어 보여 준다.

    **인증**: 쿠키 없이 요청마다 Basic 인증을 사용한다. 오른쪽 **Authorize**에 시연 계정을 입력한다. 경로 접두사로 역할이 정해진다.
    `/me/`는 VISITOR, `/merchant/`는 STAFF, `/admin/`은 ADMIN이며 그 외는 공개다. 잘못된 인증 정보는 공개 경로에서도 401이다.
    401 응답에는 `WWW-Authenticate: Basic`이 포함되므로 브라우저가 자체 로그인 창을 띄울 수 있다.

    **변경 요청**: GET·HEAD·OPTIONS 외에는 `X-CSRF-Token: api` 헤더가 필요하다. 없으면 인증 후 403 `CSRF_INVALID`다.

    **본문**: `application/json`만 받으며(그 외 415 `UNSUPPORTED_MEDIA_TYPE`) 최대 64KB다. 모르는 필드·중복 키·잘못된 JSON은 400 `INVALID_INPUT`이다.

    **공통 동작**: 모든 경로는 끝에 `/`를 붙여도 같다. GET 경로는 HEAD, 모든 경로는 OPTIONS(204와 `Allow` 헤더)도 받는다. 메서드가 다르면 405 `METHOD_NOT_ALLOWED`이며 인증을 먼저 검사한다. 없는 경로는 404 `NOT_FOUND`다.
    같은 쿼리 파라미터를 반복하면 400이다(`themeId` 제외). 모든 응답은 `Cache-Control: no-store`다. JSON 응답에는 역할·상태에 따라 달라지는 `_links`가 있으며 ID는 문자열이다.

    **오류**: 모든 오류는 `Error` 형식이다. `fieldErrors`는 항상 빈 배열이다. 각 응답 설명은 해당 요청의 업무 오류 코드를 나열한다. 어느 요청에서나 500 `INTERNAL_ERROR`, 503 `RETRY_LATER`가 발생할 수 있다.

    ## 구현 현황

    전체 **47개 경로, 73개 요청**이 구현되어 있다. 아래 그룹은 이 페이지의 묶음 이름과 같으며, 위 검색창에 그룹 이름을 입력해 좁힐 수 있다.

    | 역할 | 경로 | 요청 | 기능 |
    | --- | --- | --- | --- |
    | 공개 | 8 | 8 | 상품·가맹점·장소 조회, 추천 |
    | 방문객 | 12 | 21 | 여행 구성·기록, 이용권 발급·조회, 혜택 이력, 혜택·관광지 평가 |
    | 담당자 | 5 | 6 | 담당 가맹점, 이용권 코드 확인, 혜택 사용 처리·이력 |
    | 관리자 | 22 | 38 | 이용권 조회·취소, 평가 통계, 상품·가맹점·혜택 관리, 온톨로지 관리·검토 |
servers:
  - url: ../../api/v1
    description: 현재 서버
security:
  - basicAuth: []
tags:
  - {name: 공개 · 시작점, description: "API 진입점. 로그인 없이 사용한다."}
  - {name: 공개 · 상품, description: "판매 중인 투어패스 상품을 조회한다."}
  - {name: 공개 · 가맹점, description: "혜택을 제공하는 가맹점을 조회한다."}
  - {name: 공개 · 장소·추천, description: "장소 정보를 보고 조건에 맞는 장소를 추천받는다."}
  - {name: 방문객 · 여행, description: "내 여행을 만들고 수정·확정·보관·삭제한다."}
  - {name: 방문객 · 여행 카드, description: "여행에 카드를 담고 빼고 순서를 바꾸며 방문 기록을 남긴다."}
  - {name: 방문객 · 이용권, description: "이용권을 발급받고 내 이용권과 혜택 잔여를 확인한다."}
  - {name: 방문객 · 혜택 사용 이력, description: "내가 혜택을 사용한 내역을 확인한다."}
  - {name: 방문객 · 혜택 평가, description: "사용한 혜택을 평가한다. 추천 점수에 반영된다."}
  - {name: 방문객 · 관광지 평가, description: "장소 만족도를 평가한다. 혜택 평가·추천 점수와 별도로 집계한다."}
  - {name: 담당자 · 담당 가맹점, description: "내가 담당하는 가맹점을 확인한다."}
  - {name: 담당자 · 이용권 확인, description: "방문객의 이용권 코드를 확인해 사용 가능한 혜택을 조회한다."}
  - {name: 담당자 · 혜택 사용 처리, description: "혜택을 사용 처리하고 가맹점 사용 이력을 조회한다."}
  - {name: 관리자 · 이용권, description: "발급된 전체 이용권을 조회하고 취소한다."}
  - {name: 관리자 · 평가 통계, description: "관광지 평가를 장소별로 집계해 본다."}
  - {name: 관리자 · 상품, description: "투어패스 상품을 등록·수정한다."}
  - {name: 관리자 · 가맹점, description: "가맹점을 등록·수정한다."}
  - {name: 관리자 · 혜택, description: "상품과 가맹점을 잇는 혜택을 등록·수정한다."}
  - {name: 관리자 · 온톨로지 장소, description: "추천에 쓰는 장소를 등록·수정·검토한다."}
  - {name: 관리자 · 온톨로지 분류, description: "지역·테마·동반 유형 분류를 관리한다."}
  - {name: 관리자 · 온톨로지 관계, description: "장소-테마, 장소-동반 유형, 테마 상하 관계를 등록·수정·검토한다."}
paths:
  /:
    get:
      tags: [공개 · 시작점]
      summary: "현재 인증 상태와 이어서 호출할 수 있는 API 링크를 알려 준다."
      description: "현재 인증 상태와 이어서 호출할 수 있는 API 링크를 알려 준다.\n\n인증하면 `user`에 계정 정보를, 아니면 null을 반환한다. `_links`는 역할별로 다르다."
      security: [{}, {basicAuth: []}]
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/Index'}}}
        '401': {description: "INVALID_CREDENTIALS (잘못된 인증 정보를 보낸 경우)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /products:
    get:
      tags: [공개 · 상품]
      summary: "활성 투어패스 상품 목록을 페이지로 조회한다."
      description: "활성 투어패스 상품 목록을 페이지로 조회한다."
      security: [{}, {basicAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/ProductPage'}}}
        '400': {description: "INVALID_INPUT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "INVALID_CREDENTIALS (잘못된 인증 정보를 보낸 경우)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /products/{id}:
    get:
      tags: [공개 · 상품]
      summary: "상품 정보와 포함된 혜택을 함께 조회한다."
      description: "상품 정보와 포함된 혜택을 함께 조회한다."
      security: [{}, {basicAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}
        '400': {description: "INVALID_INPUT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "INVALID_CREDENTIALS (잘못된 인증 정보를 보낸 경우)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "NOT_FOUND", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /merchants:
    get:
      tags: [공개 · 가맹점]
      summary: "가맹점 목록을 조회한다. 지역으로 좁힐 수 있다."
      description: "가맹점 목록을 조회한다. 지역으로 좁힐 수 있다."
      security: [{}, {basicAuth: []}]
      parameters:
        - {name: regionId, in: query, schema: {$ref: '#/components/schemas/Id'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/MerchantPage'}}}
        '400': {description: "INVALID_INPUT, INVALID_CONCEPT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "INVALID_CREDENTIALS (잘못된 인증 정보를 보낸 경우)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /merchants/{id}:
    get:
      tags: [공개 · 가맹점]
      summary: "가맹점 정보와 제공 혜택을 함께 조회한다."
      description: "가맹점 정보와 제공 혜택을 함께 조회한다."
      security: [{}, {basicAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/Merchant'}}}
        '400': {description: "INVALID_INPUT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "INVALID_CREDENTIALS (잘못된 인증 정보를 보낸 경우)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "NOT_FOUND", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /places/{id}:
    get:
      tags: [공개 · 장소·추천]
      summary: "승인된 장소의 소개, 지역, 테마, 동반 유형, 출처를 조회한다."
      description: "승인된 장소의 소개, 지역, 테마, 동반 유형, 출처를 조회한다."
      security: [{}, {basicAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/Place'}}}
        '400': {description: "INVALID_INPUT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "INVALID_CREDENTIALS (잘못된 인증 정보를 보낸 경우)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "NOT_FOUND (승인되지 않은 장소 포함)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /recommendation-options:
    get:
      tags: [공개 · 장소·추천]
      summary: "추천 조건으로 고를 수 있는 테마·동반 유형·지역을 알려 준다."
      description: "추천 조건으로 고를 수 있는 테마·동반 유형·지역을 알려 준다."
      security: [{}, {basicAuth: []}]
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/RecommendationOptions'}}}
        '401': {description: "INVALID_CREDENTIALS (잘못된 인증 정보를 보낸 경우)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /recommendations:
    get:
      tags: [공개 · 장소·추천]
      summary: "장소 추천"
      description: "지역·테마·동반 유형에 맞는 장소를 점수순으로 최대 3곳 추천하고 추천 이유와 관련 혜택을 함께 준다. 지역은 필터, 테마·동반 유형은 순위 기준이다.\n\n인증한 방문객에게는 개인화 점수와 `myPassAvailability`를 포함한다."
      security: [{}, {basicAuth: []}]
      parameters:
        - {name: regionId, in: query, schema: {$ref: '#/components/schemas/Id'}}
        - {name: themeId, in: query, description: "여러 번 지정할 수 있다.", schema: {type: array, items: {$ref: '#/components/schemas/Id'}}}
        - {name: companionId, in: query, schema: {$ref: '#/components/schemas/Id'}}
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/Recommendations'}}}
        '400': {description: "INVALID_INPUT, INVALID_CONCEPT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "INVALID_CREDENTIALS (잘못된 인증 정보를 보낸 경우)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/journeys:
    get:
      tags: [방문객 · 여행]
      summary: "내 여행 목록을 상태별로 조회한다."
      description: "내 여행 목록을 상태별로 조회한다."
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [PLANNING, CONFIRMED, ARCHIVED]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/JourneySummaryPage'}}}
        '400': {description: "INVALID_INPUT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "AUTH_REQUIRED, INVALID_CREDENTIALS", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "FORBIDDEN (역할 불일치)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    post:
      tags: [방문객 · 여행]
      summary: "이름과 여행 날짜로 새 여행을 제작 중(PLANNING) 상태로 만든다."
      description: "이름과 여행 날짜로 새 여행을 제작 중(PLANNING) 상태로 만든다."
      parameters:
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyCreate'}
            example: {"name": "시흥 하루 여행", "travelDate": "2026-12-01"}
      responses:
        '201':
          description: 성공
          headers: {Location: {$ref: '#/components/headers/Location'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Journey'}}}
        '400': {description: "INVALID_INPUT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "AUTH_REQUIRED, INVALID_CREDENTIALS", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "FORBIDDEN (역할 불일치), CSRF_INVALID", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '415': {description: "UNSUPPORTED_MEDIA_TYPE", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/journeys/{id}:
    get:
      tags: [방문객 · 여행]
      summary: "내 여행의 카드 목록, 연결된 이용권, 연결 이력을 조회한다."
      description: "내 여행의 카드 목록, 연결된 이용권, 연결 이력을 조회한다."
      parameters:
        - {$ref: '#/components/parameters/Id'}
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/Journey'}}}
        '400': {description: "INVALID_INPUT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "AUTH_REQUIRED, INVALID_CREDENTIALS", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "FORBIDDEN (역할 불일치)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "NOT_FOUND", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    patch:
      tags: [방문객 · 여행]
      summary: "여행 수정·상태 전환·이용권 연결"
      description: "이름·날짜를 바꾸거나, 확정·보관 상태로 전환하거나, 이용권을 연결·해제한다. 보내는 필드만 바뀐다."
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyUpdate'}
            example: {"name": "수정한 여행"}
      responses:
        '200':
          description: 성공
          content: {application/json: {schema: {$ref: '#/components/schemas/Journey'}}}
        '400': {description: "INVALID_INPUT, JOURNEY_EMPTY", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "AUTH_REQUIRED, INVALID_CREDENTIALS", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "FORBIDDEN (역할 불일치), CSRF_INVALID", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "NOT_FOUND", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "INVALID_JOURNEY_TRANSITION, JOURNEY_LOCKED", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '415': {description: "UNSUPPORTED_MEDIA_TYPE", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [방문객 · 여행]
      summary: "제작 중인 여행을 삭제한다."
      description: "제작 중인 여행을 삭제한다."
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '204': {description: 성공(본문 없음)}
        '400': {description: "INVALID_INPUT", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: "AUTH_REQUIRED, INVALID_CREDENTIALS", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '403': {description: "FORBIDDEN (역할 불일치), CSRF_INVALID", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: "NOT_FOUND", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: "JOURNEY_LOCKED (제작 중이 아닌 여행)", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /me/journeys/{id}/places:
    post:
