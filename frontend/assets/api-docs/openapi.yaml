        issuedPassId: {type: string}
        linkedAt: {type: string}
        disconnectedAt: {type: [string, 'null']}
        productName: {type: string}
        startsAt: {type: string}
        expiresAt: {type: string}
        cancelledAt: {type: [string, 'null']}
        demoOnly: {type: boolean}
        status: {$ref: '#/components/schemas/PassStatus'}
