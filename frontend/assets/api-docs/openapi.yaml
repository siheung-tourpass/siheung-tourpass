        '415': {description: "UNSUPPORTED_MEDIA_TYPE", content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
components:
  securitySchemes:
    basicAuth: {type: http, scheme: basic}
  headers:
    Location: {description: 생성된 자원의 경로, schema: {type: string}}
  parameters:
    Id: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}, example: '1'}
    Item: {name: item, in: path, required: true, description: 여행 카드 ID, schema: {$ref: '#/components/schemas/Id'}, example: '1'}
    LookupToken: {name: token, in: path, required: true, description: 조회 응답의 id, schema: {type: string, pattern: '^[A-Za-z0-9_-]{22}$'}}
    RelationType: {name: type, in: path, required: true, schema: {$ref: '#/components/schemas/RelationType'}}
    RelationFrom: {name: from, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}, example: '1'}
    RelationTo: {name: to, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}, example: '1'}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    CsrfToken: {name: X-CSRF-Token, in: header, required: true, description: 변경 요청 필수 헤더, schema: {type: string, enum: [api], default: api}}
  schemas:
    Id: {type: string, pattern: '^[1-9][0-9]{0,18}$', example: '1'}
    Link:
      type: object
      required: [href, method]
      properties:
        href: {type: string}
        method: {type: string}
    Links:
      type: object
      description: 역할·상태에 따라 달라지는 다음 행동 링크
      additionalProperties: {$ref: '#/components/schemas/Link'}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fieldErrors]
          properties:
            code: {type: string}
            message: {type: string}
            fieldErrors: {type: array, maxItems: 0}
    IndexUser:
      type: [object, 'null']
      required: [id, displayName, role]
      properties:
        id: {type: string}
        displayName: {type: string}
        role: {type: string, enum: [VISITOR, STAFF, ADMIN]}
    PassStatus: {type: string, enum: [ACTIVE, EXPIRED, CANCELLED, NOT_STARTED]}
    AvailabilityReason: {type: string, enum: [AVAILABLE, MERCHANT_INACTIVE, BENEFIT_INACTIVE, PASS_EXPIRED, PASS_CANCELLED, PASS_NOT_STARTED, BENEFIT_ALREADY_USED]}
    FeedbackReason: {type: string, enum: [INTEREST, COMPANION_FIT, COST, GUIDANCE]}
    RelationType: {type: string, enum: [has-theme, suitable-for, sub-theme-of]}
    ThemePaths:
      type: object
      description: 거리별 상위 테마 코드 경로
      additionalProperties: {type: array, items: {type: string}}
    Index:
      type: object
      required: [user, _links]
      properties:
        user: {$ref: '#/components/schemas/IndexUser'}
        _links: {$ref: '#/components/schemas/Links'}
    Product:
      type: object
      required: [id, code, name, description, durationHours, demoOnly, active, createdAt, updatedAt, _links]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        durationHours: {type: integer}
        demoOnly: {type: boolean}
        active: {type: boolean}
        createdAt: {type: string}
        updatedAt: {type: string}
        notice: {type: string}
        benefits: {type: array, items: {$ref: '#/components/schemas/Benefit'}}
        _links: {$ref: '#/components/schemas/Links'}
    Benefit:
      type: object
      required: [id, code, productId, merchantId, name, description, benefitType, useLimit, basePriceWon, discountWon, payableWon, reservationRequired, reservationNote, demoOnly, active, createdAt, updatedAt]
      properties:
        id: {type: string}
        code: {type: string}
        productId: {type: string}
        merchantId: {type: string}
        name: {type: string}
        description: {type: string}
        benefitType: {type: string, enum: [FREE_ONCE, DISCOUNT]}
        useLimit: {type: integer}
        basePriceWon: {type: [integer, 'null']}
        discountWon: {type: [integer, 'null']}
        payableWon: {type: integer}
        reservationRequired: {type: boolean}
        reservationNote: {type: [string, 'null']}
        demoOnly: {type: boolean}
        active: {type: boolean}
        createdAt: {type: string}
        updatedAt: {type: string}
        notice: {type: string}
        merchantName: {type: string}
        placeId: {type: string}
        locationDescription: {type: string}
        placeName: {type: string}
        regionName: {type: string}
        _links: {$ref: '#/components/schemas/Links'}
    Merchant:
      type: object
      required: [id, code, placeId, name, locationDescription, demoOnly, active, createdAt, updatedAt, _links]
      properties:
        id: {type: string}
        code: {type: string}
        placeId: {type: string}
        name: {type: string}
        locationDescription: {type: string}
        demoOnly: {type: boolean}
        active: {type: boolean}
        createdAt: {type: string}
        updatedAt: {type: string}
        notice: {type: string}
        regionId: {type: string}
        regionName: {type: string}
        benefits: {type: array, items: {$ref: '#/components/schemas/Benefit'}}
        _links: {$ref: '#/components/schemas/Links'}
    ConceptRef:
      type: object
      required: [id, code, name]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
    Place:
      type: object
      required: [id, code, regionId, name, description, locationDescription, materialKind, sourceUrl, checkedOn, evidenceNote, reviewStatus, reviewedBy, reviewedAt, active, updatedAt, createdAt]
      properties:
        id: {type: string}
        code: {type: string}
        regionId: {type: string}
        name: {type: string}
        description: {type: string}
        locationDescription: {type: string}
        materialKind: {type: string, enum: [REAL, DEMO]}
        sourceUrl: {type: [string, 'null']}
        checkedOn: {type: [string, 'null']}
        evidenceNote: {type: string}
        reviewStatus: {type: string, enum: [DRAFT, APPROVED, REJECTED]}
        reviewedBy: {type: [string, 'null']}
        reviewedAt: {type: [string, 'null']}
        active: {type: boolean}
        updatedAt: {type: string}
        createdAt: {type: string}
        notice: {type: string}
        regionName: {type: string}
        themes: {$ref: '#/components/schemas/ThemePaths'}
        companions: {type: array, items: {$ref: '#/components/schemas/ConceptRef'}}
        sources: {type: array, items: {$ref: '#/components/schemas/PlaceSource'}}
        modelRevision: {type: string}
        region: {$ref: '#/components/schemas/RegionRef'}
        _links: {$ref: '#/components/schemas/Links'}
    RegionRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    PlaceSource:
      type: object
      required: [sourceUrl, checkedOn, evidenceNote]
      properties:
        id: {type: string}
        placeId: {type: string}
        sourceUrl: {type: string}
        checkedOn: {type: string}
        evidenceNote: {type: string}
        createdAt: {type: string}
        updatedAt: {type: string}
    RecommendationOptions:
      type: object
      required: [themes, companionTypes, regions, _links]
      properties:
        themes: {type: array, items: {$ref: '#/components/schemas/ConceptRef'}}
        companionTypes: {type: array, items: {$ref: '#/components/schemas/ConceptRef'}}
        regions: {type: array, items: {$ref: '#/components/schemas/ConceptRef'}}
        _links: {$ref: '#/components/schemas/Links'}
    MatchedTheme:
      type: object
      required: [path, matchType, selectedThemeId]
      properties:
        path: {type: array, items: {type: string}}
        matchType: {type: string}
        selectedThemeId: {type: string}
    RecommendationScore:
      type: object
      required: [personal, total, feedbackCount, base]
      properties:
        personal: {type: number}
        total: {type: number}
        feedbackCount: {type: integer}
        base: {type: number}
    PassBenefitRef:
      type: object
      required: [benefitId, demoOnly]
      properties:
        benefitId: {type: string}
        demoOnly: {type: boolean}
        notice: {type: string}
    MyPassAvailability:
      type: object
      required: [checkedAt, usable, issuedBenefitId, passId, reason]
      properties:
        checkedAt: {type: string}
        usable: {type: boolean}
        issuedBenefitId: {type: string}
        passId: {type: string}
        reason: {$ref: '#/components/schemas/AvailabilityReason'}
    RecommendationItem:
      type: object
      description: "myPassAvailability는 비로그인이면 null, 방문객이면 배열이다."
      required: [place, matchedThemes, companionMatched, score, personalizationReason, explanation, passBenefits, myPassAvailability, _links]
      properties:
        place: {$ref: '#/components/schemas/Place'}
        matchedThemes: {type: array, items: {$ref: '#/components/schemas/MatchedTheme'}}
        companionMatched: {type: boolean}
        score: {$ref: '#/components/schemas/RecommendationScore'}
        personalizationReason: {type: string}
        explanation: {type: string}
        passBenefits: {type: array, items: {$ref: '#/components/schemas/PassBenefitRef'}}
        myPassAvailability: {type: [array, 'null'], items: {$ref: '#/components/schemas/MyPassAvailability'}}
        _links: {$ref: '#/components/schemas/Links'}
    Recommendations:
      type: object
      required: [modelRevision, items, emptyReason, notice, _links]
      properties:
        modelRevision: {type: string}
        items: {type: array, maxItems: 3, items: {$ref: '#/components/schemas/RecommendationItem'}}
        emptyReason: {type: [string, 'null'], enum: [NO_MATCHING_PLACE, null]}
        message: {type: string}
        notice: {type: string}
        _links: {$ref: '#/components/schemas/Links'}
    JourneySummary:
      type: object
      required: [id, ownerId, name, travelDate, status, issuedPassId, createdAt, updatedAt, placeCount, _links]
      properties:
        id: {type: string}
